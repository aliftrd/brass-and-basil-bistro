<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brass &amp; Basil: Bistro Rush</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140f0d;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: pointer;
    }
    #status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Brass and Basil: Bistro Rush cooking game. Move with WASD or Arrow keys, or click kitchen stations directly."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
